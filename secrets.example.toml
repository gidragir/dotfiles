# ==============================================================================
# ~/.ygg/secrets.toml - Host Secrets & Local Overrides Template (L1)
# Copy this file to ~/.ygg/secrets.toml (chmod 600) and fill values.
# Run `ygg apply` to validate and propagate secrets.
# AI Stack secrets are managed by ai-dotfiles in mise.local.toml.
# ==============================================================================

[env]
# ── Local Daemons & System Secrets ────────────────────────────────────────────
CCTV_DAEMON_PASSWORD = "your_cctv_daemon_password"
COOLERCONTROL_TOKEN_FILE = "~/.config/coolercontrol/token"
COOLERCONTROL_TOKEN = "your_coolercontrol_token"
SEARXNG_SECRET = "your_searxng_secret_hex"
