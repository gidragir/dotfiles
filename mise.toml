[tools]
bun = "latest"
node = "lts"

[tasks."knowledge:l0"]
description = "Inspect L0 abstract mental map of the dotfiles repository"
run = "cat .agents/knowledge/dotfiles/L0_index.json"

[tasks."dotfiles:status"]
description = "Check status of ygg managed configurations"
run = "ygg status"

[tasks."dotfiles:diff"]
description = "Inspect diff between dotfiles repository and $HOME"
run = "ygg apply --dry-run"

[tasks."dotfiles:verify"]
description = "Verify zero drift between dotfiles repository and $HOME"
run = "ygg apply --dry-run"

[tasks."dotfiles:apply"]
description = "Apply repository configurations to $HOME"
run = "ygg apply"

[tasks."apply:all"]
description = "Apply omni-dotfiles (L-Core) followed by dotfiles (L-Host CachyOS)"
run = "ygg apply"

[tasks."test:e2e"]
description = "Run E2E test suite for Noctalia plugins"
run = "bash tests/e2e_virt_manager_test.sh"

[tasks."vm:create"]
description = "Automated creation of Windows 11 VM in KVM/libvirt"
run = "bash scripts/create_win11_vm.sh"

[tasks."vm:postinstall"]
description = "Post-installation configuration for Windows 11 VM (virtio-fs and video)"
run = "bash scripts/configure_win11_vm_postinstall.sh"

[tasks."disk:wipe"]
description = "Destructive disk wipe utility for /dev/nvme1n1"
run = "sudo bash scripts/patrition_delete.sh"

[tasks."docker:check"]
description = "Verify Docker storage configuration (overlay2 + XFS)"
run = "sudo bash scripts/check.sh"

[tasks."setup:gaming"]
description = "Install Steam, Lutris, NVIDIA tools and gaming directories on demand"
run = "ansible-playbook -K playbooks/setup_gaming.yml"

[tasks."setup:virt"]
description = "Provision KVM/QEMU, libvirt daemon, networks and groups on demand"
run = "ansible-playbook -K playbooks/setup_virt.yml"

[tasks."setup:cooler-control"]
description = "Configure CoolerControl daemon, fan curves and hardware monitoring"
run = "ansible-playbook -K playbooks/setup_cooler_control.yml"

[tasks."setup:sddm"]
description = "Configure SDDM multi-monitor isolation and Catppuccin theme"
run = "ansible-playbook -K playbooks/setup_display_manager.yml"

[tasks."setup:wallpaper-engine"]
description = "Install linux-wallpaperengine and configure Steam Workshop integration"
run = "ansible-playbook playbooks/setup_wallpaper_engine.yml"

[tasks."net:optimize"]
description = "Apply TCP BBR, FQ-CoDel and network QoS tuning"
run = "ansible-playbook -K playbooks/setup_network_optimization.yml --tags apply"

[tasks."net:revert"]
description = "Revert TCP BBR and network QoS tuning to system defaults"
run = "ansible-playbook -K playbooks/setup_network_optimization.yml --tags revert"

[tasks."rclone:resync"]
description = "Perform initial rclone bisync resync for Obsidian vault"
run = "rclone bisync /data/obsidian gdrive:Obsidian --resync --fast-list --modify-window 2s --resilient --recover --retries 3 -v"
