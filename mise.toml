[tools]
bun = "latest"
node = "lts"

[tasks."ai:status"]
description = "Quick status check for Ollama, Headroom, Khoj, and Postgres"
run = """
echo "=== AI Services Status ==="
systemctl --user is-active ollama.service &>/dev/null && echo "✓ Ollama: active (:11434)" || echo "✗ Ollama: inactive"
systemctl --user is-active headroom-default.service &>/dev/null && echo "✓ Headroom: active (:8787)" || echo "✗ Headroom: inactive"
docker ps --filter "name=khoj"
curl -sf http://127.0.0.1:42110/api/health >/dev/null && echo "✓ Khoj Health: OK (:42110)" || echo "✗ Khoj Health: Failed"
"""

[tasks."knowledge:l0"]
description = "Inspect L0 abstract mental map of the dotfiles repository"
run = "cat .agents/knowledge/dotfiles/L0_index.json"

[tasks."dotfiles:status"]
description = "Check status of Chezmoi managed configurations"
run = "chezmoi status"

[tasks."dotfiles:diff"]
description = "Inspect diff between dotfiles repository and $HOME"
run = "chezmoi diff"

[tasks."dotfiles:verify"]
description = "Verify zero drift between dotfiles repository and $HOME"
run = "chezmoi verify"

[tasks."dotfiles:apply"]
description = "Apply repository configurations to $HOME"
run = "chezmoi apply --source /data/projects/dotfiles --force"

[tasks."apply:all"]
description = "Apply omni-dotfiles (L-Core) followed by dotfiles (L-Host CachyOS)"
run = """
chezmoi apply --source /home/gidragir/projects/omni-dotfiles
chezmoi apply --source /data/projects/dotfiles --force
"""

[tasks."test:e2e"]
description = "Run E2E test suite for Noctalia plugins"
run = "bash tests/e2e_virt_manager_test.sh"

[tasks."test:check"]
description = "Run comprehensive host environment health check"
run = "bash scripts/check_setup.sh"
