# Хостовые настройки Noctalia для профиля pc (накладываются поверх config.toml)

[bar.islands]
end = [
    "hermes",
    "headroom",
    "docker",
    "obsidian",
    "openrgb",
    "temp",
    "cpu",
    "gpu",
    "ram",
    "keyboard_layout",
    "audio_switcher",
    "tray",
    "notifications",
]

[battery]
warning_threshold = 10

[brightness]
enable_ddcutil = false
ignore_mmids = []
minimum_brightness = 0.0
sync_all_monitors = false

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
action = "lock"
command = ""
enabled = false
locked_timeout = 0.0
resume_command = ""
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
command = ""
enabled = false
locked_timeout = 0.0
resume_command = ""
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
command = ""
enabled = false
locked_timeout = 0.0
resume_command = ""
timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@winit"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@winit"]
box_height = 196.0
box_width = 810.0
cx = 1711.9996337890625
cy = 1212.0
enabled = true
output = "winit"
placement_height = 1394.0
placement_width = 3424.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = [
    "noctalia/notes",
    "gidragir/hermes",
    "gidragir/openrgb",
    "gidragir/obsidian",
    "gidragir/virt-manager",
    "gidragir/ytm",
    "ayagmar/headroom",
    "yuuto/arch-updater",
    "8bury/mini-docker",
    "gidragir/audio-outputs",
    "gustav0ar/drive-health",
    "teagar/niri-workspace-preview",
]

[widget.openrgb]
type = "gidragir/openrgb:widget"
