id = "gidragir/openrgb"
name = "OpenRGB Control"
version = "2.0.0"
plugin_api = 9
author = "gidragir"
license = "MIT"
dependencies = ["openrgb", "jq"]
tags = ["hardware", "bar", "panel", "utility"]
icon = "palette"
description = "Control RGB lighting, switch presets, and manage profiles via OpenRGB."

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 10
min = 1
max = 60

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 540
placement = "attached"
position = "auto"
open_near_click = true
