# ==============================================================================
# ~/.config/chezmoi/secrets.toml - Host Secrets & Local Overrides Template
# Copy this file to ~/.config/chezmoi/secrets.toml (chmod 600) and fill values.
# Run `chezmoi apply` to propagate to ~/.config/environment.d/ and ~/.zshenv.
# ==============================================================================

[env]
# ── Google Gemini & Antigravity (AGY) ─────────────────────────────────────────
GOOGLE_API_KEY = "your_google_api_key"
GEMINI_API_KEY = "your_gemini_api_key"

# ── Telegram Gateway Integration ──────────────────────────────────────────────
TELEGRAM_BOT_TOKEN = "your_telegram_bot_token"
TELEGRAM_ALLOWED_USERS = "your_telegram_user_id"
TELEGRAM_GROUP_ALLOWED_USERS = "your_telegram_user_id"
TELEGRAM_GROUP_ALLOWED_CHATS = "*"
GATEWAY_ALLOW_ALL_USERS = "true"

# ── Local Environment & Vault Paths ───────────────────────────────────────────
OBSIDIAN_VAULT_PATH = "/data/obsidian"
PYTHONPATH = "/home/gidragir/.local/lib/python3.11/site-packages"

# ── Hermes Host Rendezvous & Dashboard ────────────────────────────────────────
HERMES_DASHBOARD_TOKEN = "your_hermes_dashboard_token"
HERMES_DASHBOARD_URL = "http://127.0.0.1:9119"

# ── Local Daemons & System Secrets ────────────────────────────────────────────
CCTV_DAEMON_PASSWORD = "your_cctv_daemon_password"
COOLERCONTROL_TOKEN_FILE = "/home/gidragir/.config/coolercontrol/token"
COOLERCONTROL_TOKEN = "your_coolercontrol_token"
SEARXNG_SECRET = "your_searxng_secret_hex"

# ── Khoj API & Service Secrets ────────────────────────────────────────────────
KHOJ_BASE_URL = "http://127.0.0.1:42110"
KHOJ_API_TOKEN = "your_khoj_api_bearer_token"
KHOJ_ADMIN_TOKEN = "your_khoj_admin_bearer_token"
RESEND_API_KEY = "re_dummy_local"
