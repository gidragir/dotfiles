---
# =============================================================================
# Playbook : setup_wallpaper_engine.yml
# Purpose  : Install linux-wallpaperengine from AUR, set up runner script,
#            create configuration and systemd user service for CachyOS / Niri.
# Usage    : ansible-playbook setup_wallpaper_engine.yml
#            ansible-playbook -K setup_wallpaper_engine.yml (if sudo needed for AUR temp access)
# =============================================================================

- name: Setup Wallpaper Engine for CachyOS & Niri (Wayland)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    wallpaper_engine_aur_packages:
      - linux-wallpaperengine-git

  tasks:
    # ── 1. Discover User and Environment ──────────────────────────────────────
    - name: Discover real non-root user
      ansible.builtin.set_fact:
        real_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id'], true) }}"

    - name: Get user passwd info
      ansible.builtin.getent:
        database: passwd
        key: "{{ real_user }}"

    - name: Set home directory fact
      ansible.builtin.set_fact:
        real_home: "{{ ansible_facts['getent_passwd'][real_user][4] }}"

    # ── 2. Install linux-wallpaperengine from AUR ─────────────────────────────
    - name: Check if paru is available for AUR packages
      ansible.builtin.command: which paru
      register: check_paru
      failed_when: false
      changed_when: false
      become: false

    - name: Install linux-wallpaperengine-git via paru (AUR)
      kewlfft.aur.aur:
        name: "{{ item }}"
        use: paru
      loop: "{{ wallpaper_engine_aur_packages }}"
      when: check_paru.rc == 0
      become: false

    # ── 3. Configure Directories & Default Settings ───────────────────────────
    - name: Ensure configuration and user local directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0755'
      loop:
        - "{{ real_home }}/.config/wallpaper-engine"
        - "{{ real_home }}/.local/bin"
        - "{{ real_home }}/.local/share/Steam/steamapps/workshop/content/431960"
        - "{{ real_home }}/.config/systemd/user"
      become: false

    - name: Create default wallpaper-engine configuration file
      ansible.builtin.copy:
        dest: "{{ real_home }}/.config/wallpaper-engine/config.json"
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0644'
        force: no
        content: |
          {
            "assets_dir": "{{ real_home }}/.local/share/Steam/steamapps/common/wallpaper_engine/assets",
            "default_wallpaper_id": "",
            "fps": 60,
            "volume": 0,
            "silent": true,
            "clamped": true
          }
      become: false

    # ── 4. Ensure Wallpaper Runner Script ─────────────────────────────────────
    - name: Ensure wallpaper-engine-runner symlink in ~/.local/bin
      ansible.builtin.file:
        src: "{{ real_home }}/.zsh/scripts/wallpaper-engine-runner"
        dest: "{{ real_home }}/.local/bin/wallpaper-engine-runner"
        state: link
        force: yes
      become: false

    # ── 5. Configure Waypaper Integration ─────────────────────────────────────
    - name: Ensure ~/.config/waypaper directory exists
      ansible.builtin.file:
        path: "{{ real_home }}/.config/waypaper"
        state: directory
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0755'
      become: false

    - name: Configure Waypaper post_command and wallpaperengine_folder
      ansible.builtin.ini_file:
        path: "{{ real_home }}/.config/waypaper/config.ini"
        section: Settings
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0644'
      loop:
        - { option: "backend", value: "custom" }
        - { option: "post_command", value: "{{ real_home }}/.zsh/scripts/wallpaper-engine-runner $wallpaper" }
        - { option: "wallpaperengine_folder", value: "{{ real_home }}/.local/share/Steam/steamapps/workshop/content/431960" }
        - { option: "folder", value: "{{ real_home }}/.local/share/Steam/steamapps/workshop/content/431960" }
        - { option: "subfolders", value: "True" }
      become: false
      ignore_errors: true

    # ── 6. Create Systemd User Service ────────────────────────────────────────
    - name: Create wallpaper-engine systemd user service
      ansible.builtin.copy:
        dest: "{{ real_home }}/.config/systemd/user/wallpaper-engine.service"
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0644'
        content: |
          [Unit]
          Description=Wallpaper Engine for Niri / Wayland
          After=graphical-session.target
          PartOf=graphical-session.target

          [Service]
          Type=simple
          ExecStart=%h/.zsh/scripts/wallpaper-engine-runner
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=graphical-session.target
      become: false

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: yes
        scope: user
      become: false
      ignore_errors: true

    # ── 6. Summary & Usage Instructions ───────────────────────────────────────
    - name: Display post-installation instructions
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "🖼️  Wallpaper Engine Setup Complete!"
          - "========================================================================="
          - "1. Package: 'linux-wallpaperengine' (AUR) installed."
          - "2. Workshop Directory:"
          - "   ~/.local/share/Steam/steamapps/workshop/content/431960"
          - "3. Configuration & Scripts:"
          - "   - Config: ~/.config/wallpaper-engine/config.json"
          - "   - Runner script: ~/.local/bin/wallpaper-engine-runner"
          - "4. How to Run / Manage:"
          - "   - Test run manually: wallpaper-engine-runner <wallpaper_id>"
          - "   - Start user service: systemctl --user start wallpaper-engine.service"
          - "   - Enable at boot/login: systemctl --user enable wallpaper-engine.service"
          - "========================================================================="
      become: false
