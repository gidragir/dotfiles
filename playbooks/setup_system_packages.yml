---
# =============================================================================
# Playbook : setup_system.yml
# Purpose  : Install and maintain system packages on CachyOS.
# Requires : Root privileges (run with become: true or as root user)
# Usage    : ansible-playbook setup_system.yml
# =============================================================================

- name: Install and Maintain System Packages
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Install system packages via pacman
      community.general.pacman:
        name:
          - base-devel
          - parted
          - btrfs-progs
          - libvirt
          - qemu-desktop
          - virt-manager
          - edk2-ovmf
          - swtpm
          - dnsmasq
          - bridge-utils
          - rclone
          - mold
          - sccache
          - clang
          - distrobox
          - docker
          - docker-compose
          - docker-buildx
          - ansible
          - vim
          - hypridle
        state: present
        update_cache: true

    - name: Remove unwanted packages (firefox, alacritty)
      community.general.pacman:
        name:
          - firefox
          - alacritty
        state: absent
