---
# =============================================================================
# Playbook : setup_user.yml
# Purpose  : Install user applications, toolchains, configurations, and systemd units.
# Requires : Run as normal user (non-root).
# Usage    : ansible-playbook setup_user.yml
# =============================================================================

- name: Install and Maintain User Packages, Dotfiles, and Toolchains
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:
    # ── 1. Install AUR Packages via paru ──────────────────────────────────────
    - name: Verify paru is installed
      ansible.builtin.command: which paru
      register: check_paru
      changed_when: false
      tags: [packages]

    - name: Install official packages via pacman
      community.general.pacman:
        name: "{{ pacman_packages }}"
        state: present
        extra_args: "--needed"
      become: true
      vars:
        pacman_packages:
          - rustup
          - neovim
          - jq
          - yq
          - chromium
          - stow
          - git
          - ripgrep
          - fd
          - bat
          - eza
          - lazygit
          - lazydocker
          - kubectl
          - kubectx
          - k9s
          - sops
          - age
          - argocd
          - rofi
          - zoxide
          - helm
          - starship
          - openrgb
          - piper
          - libratbag
          - zellij
          - obsidian
          - k3d
          - biome
      tags: [packages]

    - name: Install AUR utilities and applications via paru
      ansible.builtin.command:
        cmd: paru -S --needed --noconfirm {{ aur_packages | join(' ') }}
      register: paru_result
      changed_when: "'there is nothing to do' not in paru_result.stdout"
      vars:
        aur_packages:
          - vivaldi
          - visual-studio-code-bin
          - ferdium-bin
          - tor-browser-bin
          - television
          - lefthook
          - turbo
          - android-studio
          - ghostty
          - warp-terminal
          - superfile
          - carapace-bin
          - mise
      tags: [packages]

    # ── 2. Configure Projects symlink & GNU Stow (Dotfiles) ───────────────────
    - name: Create projects symlink
      ansible.builtin.file:
        src: /data/projects
        dest: "{{ ansible_env.HOME }}/projects"
        state: link
        force: yes
      tags: [stow]

    - name: Clone dotfiles repository
      ansible.builtin.git:
        repo: https://github.com/gidragir/dotfiles.git
        dest: /data/projects/dotfiles
        update: no
      tags: [stow]

    - name: Ensure target config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_env.HOME }}/.cargo"
        - "{{ ansible_env.HOME }}/.config"
      tags: [stow]

    - name: Remove existing config files to avoid stow conflicts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ansible_env.HOME }}/.zshrc"
        - "{{ ansible_env.HOME }}/.cargo/config.toml"
        - "{{ ansible_env.HOME }}/.config/ghostty"
        - "{{ ansible_env.HOME }}/.config/hypr"
        - "{{ ansible_env.HOME }}/.config/k3d"
        - "{{ ansible_env.HOME }}/.config/k9s"
        - "{{ ansible_env.HOME }}/.config/mise"
        - "{{ ansible_env.HOME }}/.config/niri"
        - "{{ ansible_env.HOME }}/.config/nvim"
        - "{{ ansible_env.HOME }}/.config/rofi"
        - "{{ ansible_env.HOME }}/.config/starship.toml"
        - "{{ ansible_env.HOME }}/.config/superfile"
        - "{{ ansible_env.HOME }}/.config/television"
        - "{{ ansible_env.HOME }}/.config/zellij"
      tags: [stow]

    - name: Run GNU Stow to link configurations
      ansible.builtin.command:
        cmd: stow -t "{{ ansible_env.HOME }}" */
        chdir: /data/projects/dotfiles
      tags: [stow]

    # ── 3. Rust & Cargo (Optimized Layout) ────────────────────────────────────
    - name: Create Cargo cache directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_env.HOME }}/.cargo"
        - "/data/projects/.cargo-cache/registry"
        - "/data/projects/.cargo-cache/git"
        - "/data/projects/.sccache"
      tags: [cargo]

    - name: Create symlinks for Cargo caches
      ansible.builtin.file:
        src: "/data/projects/.cargo-cache/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.cargo/{{ item }}"
        state: link
        force: yes
      loop:
        - registry
        - git
      tags: [cargo]

    - name: Check if rustup is installed
      ansible.builtin.command: which rustup
      register: rustup_check
      ignore_errors: true
      changed_when: false
      tags: [cargo]

    - name: Set rustup default stable
      ansible.builtin.command: rustup default stable
      when: rustup_check.rc == 0
      tags: [cargo]

    - name: Check which cargo tools are already installed
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.cargo/bin/{{ item }}"
      register: tool_stats
      loop:
        - cargo-ramdisk
        - cargo-nextest
        - bacon
        - cargo-machete
      tags: [cargo]

    - name: Install cargo utilities
      ansible.builtin.command:
        cmd: cargo binstall -y {{ item.item }}
      loop: "{{ tool_stats.results }}"
      when: not item.stat.exists
      tags: [cargo]

    # ── 4. Dev Tools via mise & pnpm ──────────────────────────────────────────
    - name: Install runtimes and tools via mise
      ansible.builtin.command: mise install
      changed_when: false
      tags: [mise]

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: '0755'
      tags: [mise]

    - name: Enable pnpm via corepack using mise node
      ansible.builtin.command:
        cmd: mise exec node -- corepack enable --install-directory "{{ ansible_env.HOME }}/.local/bin" pnpm
      register: corepack_pnpm
      changed_when: false
      tags: [mise]

    - name: Create pnpm store directory
      ansible.builtin.file:
        path: "/data/projects/.pnpm-store"
        state: directory
        mode: '0755'
      tags: [mise]

    - name: Create uv cache directory
      ansible.builtin.file:
        path: "/data/projects/.uv-cache"
        state: directory
        mode: '0755'
      tags: [mise]

    # ── 5. Systemd Services, Timers, and System Daemons ───────────────────────
    - name: Ensure systemd user directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/systemd/user"
        state: directory
        mode: '0755'
      tags: [systemd]

    - name: Create rclone-mount.service
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/rclone-mount.service"
        mode: '0644'
        content: |
          [Unit]
          Description=Rclone – Mount Google Drive
          After=network-online.target

          [Service]
          Type=notify
          ExecStart=/usr/bin/rclone mount gdrive: /data/gdrive \
              --vfs-cache-mode full \
              --dir-cache-time 72h \
              --vfs-cache-max-size 10G \
              --log-level INFO \
              --log-file=%h/.cache/rclone/gdrive-mount.log
          ExecStop=/bin/fusermount -u /data/gdrive
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=default.target
      tags: [systemd]

    - name: Create rclone-sync.service
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/rclone-sync.service"
        mode: '0644'
        content: |
          [Unit]
          Description=Rclone – Sync /data/sync → Google Drive

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/rclone sync /data/sync gdrive:MySyncBackup \
              --fast-list \
              --log-level INFO \
              --log-file=%h/.cache/rclone/sync.log
      tags: [systemd]

    - name: Create rclone-sync.timer
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/rclone-sync.timer"
        mode: '0644'
        content: |
          [Unit]
          Description=Run rclone sync every hour

          [Timer]
          OnBootSec=5m
          OnUnitActiveSec=1h

          [Install]
          WantedBy=timers.target
      tags: [systemd]

    - name: Create rclone cache directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cache/rclone"
        state: directory
        mode: '0755'
      tags: [systemd]

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: yes
        scope: user
      tags: [systemd]

    - name: Check if rclone is configured
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/rclone/rclone.conf"
      register: rclone_conf_check
      tags: [systemd]

    - name: Enable rclone services and timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        scope: user
      loop:
        - rclone-mount.service
        - rclone-sync.timer
      when: rclone_conf_check.stat.exists
      tags: [systemd]

    - name: Enable and start ratbagd system service
      ansible.builtin.systemd:
        name: ratbagd
        enabled: yes
        state: started
      become: true
      tags: [systemd]
