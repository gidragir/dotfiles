---
# =============================================================================
# Playbook : setup_user.yml
# Purpose  : Install user applications, toolchains, configurations, and systemd units.
# Requires : Run as normal user (non-root).
# Usage    : ansible-playbook setup_user.yml
# =============================================================================

- name: Install and Maintain User Packages, Dotfiles, and Toolchains
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:


    # ── 2. Configure Projects symlink & GNU Stow (Dotfiles) ───────────────────
    - name: Create projects symlink
      ansible.builtin.file:
        src: /data/projects
        dest: "{{ ansible_facts.env.HOME }}/projects"
        state: link
        force: yes
      tags: [stow]

    - name: Clone dotfiles repository
      ansible.builtin.git:
        repo: https://github.com/gidragir/dotfiles.git
        dest: /data/projects/dotfiles
        update: no
      tags: [stow]

    - name: Ensure target config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_facts.env.HOME }}/.cargo"
        - "{{ ansible_facts.env.HOME }}/.config"
        - "{{ ansible_facts.env.HOME }}/.local/state/zsh"
      tags: [stow]

    - name: Remove existing config files to avoid stow conflicts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ansible_facts.env.HOME }}/.zshrc"
        - "{{ ansible_facts.env.HOME }}/.cargo/config.toml"
        - "{{ ansible_facts.env.HOME }}/.config/atuin"
        - "{{ ansible_facts.env.HOME }}/.config/ghostty"
        - "{{ ansible_facts.env.HOME }}/.config/hypr"
        - "{{ ansible_facts.env.HOME }}/.config/k3d"
        - "{{ ansible_facts.env.HOME }}/.config/k9s"
        - "{{ ansible_facts.env.HOME }}/.config/mise"
        - "{{ ansible_facts.env.HOME }}/.config/niri"
        - "{{ ansible_facts.env.HOME }}/.config/nvim"
        - "{{ ansible_facts.env.HOME }}/.config/rofi"
        - "{{ ansible_facts.env.HOME }}/.config/sheldon"
        - "{{ ansible_facts.env.HOME }}/.config/starship.toml"
        - "{{ ansible_facts.env.HOME }}/.config/superfile"
        - "{{ ansible_facts.env.HOME }}/.config/television"
        - "{{ ansible_facts.env.HOME }}/.config/vivaldi-stable.conf"
        - "{{ ansible_facts.env.HOME }}/.config/zellij"
      tags: [stow]

    - name: Run GNU Stow to link configurations
      ansible.builtin.shell:
        cmd: stow -t "{{ ansible_facts.env.HOME }}" $(find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' ! -name 'playbooks' -exec basename {} \;)
        chdir: /data/projects/dotfiles
      tags: [stow]

    # ── 3. Rust & Cargo (Optimized Layout) ────────────────────────────────────
    - name: Create Cargo cache directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_facts.env.HOME }}/.cargo"
        - "/data/projects/.cargo-cache/registry"
        - "/data/projects/.cargo-cache/git"
        - "/data/projects/.sccache"
      tags: [cargo]

    - name: Create symlinks for Cargo caches
      ansible.builtin.file:
        src: "/data/projects/.cargo-cache/{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.cargo/{{ item }}"
        state: link
        force: yes
      loop:
        - registry
        - git
      tags: [cargo]

    # ── 4. Dev Tools via mise & pnpm ──────────────────────────────────────────
    - name: Install runtimes and tools via mise
      ansible.builtin.command: mise install
      changed_when: false
      tags: [mise]

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: '0755'
      tags: [mise]

    - name: Enable pnpm via corepack using mise node
      ansible.builtin.command:
        cmd: mise exec node -- corepack enable --install-directory "{{ ansible_facts.env.HOME }}/.local/bin" pnpm
      register: corepack_pnpm
      changed_when: false
      tags: [mise]

    - name: Create pnpm store directory
      ansible.builtin.file:
        path: "/data/projects/.pnpm-store"
        state: directory
        mode: '0755'
      tags: [mise]

    - name: Create uv cache directory
      ansible.builtin.file:
        path: "/data/projects/.uv-cache"
        state: directory
        mode: '0755'
      tags: [mise]

    # ── 5. Systemd Services, Timers, and System Daemons ───────────────────────
    - name: Ensure systemd user directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        state: directory
        mode: '0755'
      tags: [systemd]

    - name: Ensure /data/obsidian directory exists
      ansible.builtin.file:
        path: /data/obsidian
        state: directory
        mode: '0755'
      tags: [systemd]

    - name: Create rclone-obsidian-sync.service
      ansible.builtin.copy:
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/rclone-obsidian-sync.service"
        mode: '0644'
        content: |
          [Unit]
          Description=Rclone – Bisync Obsidian Vault with Google Drive

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/rclone bisync /data/obsidian gdrive:Obsidian \
              --fast-list \
              --log-level INFO \
              --log-file=%h/.cache/rclone/obsidian-sync.log
      tags: [systemd]

    - name: Create rclone-obsidian-sync.timer
      ansible.builtin.copy:
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/rclone-obsidian-sync.timer"
        mode: '0644'
        content: |
          [Unit]
          Description=Run rclone bisync for Obsidian every 15 minutes

          [Timer]
          OnBootSec=2m
          OnUnitActiveSec=15m

          [Install]
          WantedBy=timers.target
      tags: [systemd]

    - name: Create rclone cache directory
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.cache/rclone"
        state: directory
        mode: '0755'
      tags: [systemd]

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: yes
        scope: user
      tags: [systemd]

    - name: Check if rclone is configured
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/rclone/rclone.conf"
      register: rclone_conf_check
      tags: [systemd]

    - name: Enable rclone timers
      ansible.builtin.systemd:
        name: rclone-obsidian-sync.timer
        enabled: yes
        state: started
        scope: user
      when: rclone_conf_check.stat.exists
      tags: [systemd]

    - name: Enable and start ratbagd system service
      ansible.builtin.systemd:
        name: ratbagd
        enabled: yes
        state: started
      become: true
      tags: [systemd]

    # ── 6. Default MIME Associations (Text & Markdown → Neovim) ─────────────
    - name: Set Neovim as default application for text and markdown files
      ansible.builtin.ini_file:
        path: "{{ ansible_facts.env.HOME }}/.config/mimeapps.list"
        section: Default Applications
        option: "{{ item }}"
        value: nvim.desktop
        mode: '0644'
      loop:
        - text/markdown
        - text/plain
        - text/x-markdown
      tags: [mime]

