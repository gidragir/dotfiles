---
# =============================================================================
# Package Variables Configuration
# This file serves as the single source of truth for packages to be installed
# on the hosts.
# =============================================================================

# Host Profile Default ('desktop' | 'laptop')
# Can be overridden via ansible-playbook extra vars: -e "host_profile=laptop"
host_profile: desktop

# System-level packages (installed via pacman, requires sudo)
system_packages:
  - base-devel
  - zsh
  - parted
  - btrfs-progs
  - xfsprogs
  - libvirt
  - qemu-desktop
  - virt-manager
  - virt-viewer
  - edk2-ovmf
  - swtpm
  - dnsmasq
  - rclone
  - mold
  - sccache
  - clang
  - distrobox
  - docker
  - docker-compose
  - docker-buildx
  - ansible
  - vim
  - hypridle
  - cargo-binstall
  - cliphist
  - wtype

# Packages to be explicitly removed from the system
unwanted_packages:
  - firefox
  - alacritty

# Essential CLI tools for shell environment (pacman / AUR)
cli_essential_packages:
  - chezmoi
  - sheldon
  - starship
  - zoxide
  - atuin
  - eza
  - bat
  - ripgrep
  - fd
  - lazygit
  - jq
  - yq
  - fzf
  - imv
  - carapace-bin
  - television
  - btop
  - glow

# Official pacman packages for the user (installed via pacman, requires sudo)
user_pacman_packages:
  - rustup
  - neovim
  - jq
  - yq
  - chromium
  - chezmoi
  - stow   # Required for ai-dotfiles repository on workstation host
  - git
  - ripgrep
  - fd
  - bat
  - eza
  - lazygit
  - lazydocker
  - kubectl
  - kubectx
  - k9s
  - sops
  - age
  - argocd
  - rofi
  - zoxide
  - helm
  - starship
  - atuin
  - piper
  - libratbag
  - zellij
  - obsidian
  - biome
  - imv
  - sheldon
  - ddcutil
  - wlsunset

# Dedicated GPU/AI inference packages (installed on-demand via setup_ollama.yml)
ollama_packages:
  - ollama
  - ollama-cuda

# AUR packages (installed via paru, MUST run as normal user)
aur_packages:
  - vivaldi
  - visual-studio-code-bin
  - ferdium-bin
  - tor-browser-bin
  - television
  - lefthook
  - turbo
  - android-studio
  - ghostty
  - warp-terminal
  - superfile
  - carapace-bin
  - mise
  - k3d
  - noctalia-qs
  - noctalia
  - noctalia-shell

# Desktop-specific AUR packages (installed conditionally when host_profile == 'desktop')
desktop_aur_packages:
  - openrgb
  - coolercontrold-bin
  - coolercontrol-bin

# Laptop-specific AUR/system packages (installed conditionally when host_profile == 'laptop')
laptop_aur_packages:
  - brightnessctl

# Cargo utilities (installed via cargo binstall, MUST run as normal user)
cargo_packages:
  - cargo-ramdisk
  - cargo-nextest
  - bacon
  - cargo-machete

# Python CLI tools (installed via uv tool in isolated virtualenvs)
uv_tools:
  - "headroom-ai[proxy,code,mcp]"

