---
# =============================================================================
# Playbook : setup_gaming.yml
# Purpose  : Install Steam, gaming & NVIDIA GPU tools (envycontrol, prime-run, nvidia-utils),
#            configure gaming paths (/data/games), set global gaming environment variables,
#            and set default Steam library symlink.
# Requires : Sudo access for system packages and directory permissions.
# Usage    : ansible-playbook -K setup_gaming.yml
#            ansible-playbook -K setup_gaming.yml -e "switch_gpu_to_nvidia=true"
# =============================================================================

- name: Setup Steam and Gaming Environment on CachyOS
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    # ── 1. Discover User and Environment ──────────────────────────────────────
    - name: Discover real non-root user
      ansible.builtin.set_fact:
        real_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id'], true) }}"

    - name: Get user passwd info
      ansible.builtin.getent:
        database: passwd
        key: "{{ real_user }}"

    - name: Set home directory fact
      ansible.builtin.set_fact:
        real_home: "{{ getent_passwd[real_user][4] }}"

    - name: Ensure environment.d directory exists
      ansible.builtin.file:
        path: "{{ real_home }}/.config/environment.d"
        state: directory
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0755'
      become: false

    - name: Configure global gaming environment variables (~/.config/environment.d/10-gaming.conf)
      ansible.builtin.copy:
        dest: "{{ real_home }}/.config/environment.d/10-gaming.conf"
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0644'
        content: |
          # Optimized gaming environment variables for Proton & Niri
          PROTON_USE_NTSYNC=1
          PROTON_LOCAL_SHADER_CACHE=0
          PROTON_ENABLE_WAYLAND=0
          PROTON_ENABLE_HDR=0
      become: false