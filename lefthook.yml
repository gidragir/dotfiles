# =============================================================================
# Lefthook Git Pre-Commit Configuration for Dotfiles
# Focus: Syntax verification, host configuration sanity checks
# =============================================================================
pre-commit:
  parallel: false
  commands:
    check-shell:
      glob: "{scripts/**/*.sh,home/dot_zsh/scripts/*.sh,tests/**/*.sh}"
      run: bash -n {all_files}

    check-niri:
      glob: "home/dot_config/niri/**/*.kdl"
      run: niri validate -c ~/.config/niri/config.kdl

    check-ansible:
      glob: "playbooks/**/*.yml"
      run: ansible-playbook --syntax-check playbooks/setup_system.yml playbooks/setup_user.yml playbooks/packages.yml
